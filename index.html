<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BeBloody</title>
    <meta name="description" content="Suivi des dons de sang total, plasma et plaquettes, avec calcul de la prochaine date de don possible." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c0392b" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />

    <!-- iOS Safari ignores the web manifest for "add to home screen" behavior
         and icon, so it needs these set explicitly. Also served at this
         exact root path (not just referenced here) since iOS also probes
         /apple-touch-icon.png by convention, independently of this tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeBloody" />

    <!-- iOS also ignores the manifest for its "Add to Home Screen" launch
         screen (Android/Chrome synthesizes one from the manifest on its
         own) — without these, iOS just flashes plain white before the app's
         UI paints. One pair (portrait + landscape) per current iPhone
         screen size/pixel-ratio; `device-width`/`device-height` always use
         the portrait point values, `orientation` alone picks the pair — see
         scripts/generate-splash.mjs, which renders these from the same mark
         as the app icon. Older/discontinued screen sizes aren't covered and
         just keep the plain-white default, same as before this. -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1334-750.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1242-2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1125-2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/splash/apple-splash-828-1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
